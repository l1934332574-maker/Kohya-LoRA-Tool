<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kohya-LoRA 一键训练工具</title>
  <desc id="desc">Windows 本地训练工作台。四类训练引擎，共用从环境、数据、训练到结果的一套项目流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172442"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b9cff"/><stop offset="1" stop-color="#77ddce"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#526084" stroke-width=".6" opacity=".19"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <circle cx="1150" cy="34" r="165" fill="#536bd9" opacity=".08"/>
  <circle cx="730" cy="364" r="205" fill="#4bbdad" opacity=".04"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
