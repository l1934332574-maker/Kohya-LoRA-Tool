name: Windows unsigned build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-unsigned.yml'
      - 'build_exe/**'
      - 'kohya_gui.py'
      - 'Kohya一键工具.py'
      - 'kohya_core/**'
      - 'gui/**'
      - 'modern_ui/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modern_ui/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r build_exe/requirements-build.txt
      - name: Build unsigned EXE and installer
        run: python build_exe/build_unsigned.py
      - name: Upload unsigned review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-${{ github.sha }}
          path: build_exe/unsigned/*
          if-no-files-found: error
          retention-days: 14
